[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-soc-soh-aging-estimation"
version = "1.1.1"
description = "Battery SOC/SOH estimation with a 2-RC ECM, EKF/UKF, and aging-aware adaptation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "scipy>=1.11",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/Jerry-124/battery-soc-soh-aging-estimation"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
