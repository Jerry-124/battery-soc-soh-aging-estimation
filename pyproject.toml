[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-soc-soh-aging-estimation"
version = "0.1.0"
description = "Battery SOC/SOH estimation with a 2-RC ECM, EKF/UKF, and aging-aware adaptation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
